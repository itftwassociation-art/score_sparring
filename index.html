<title>ITF Sparring Scoreboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* One screen, no scrolling. Red always left, blue always right; blue is the mirror image of red. */
  :root {
    --bg: #E8EBF0; --fg: #141A24; --line: #C6CCD7; --red: #C42E33; --blue: #1D4DBB;
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0D1117; --fg: #E7EBF2; --line: #262D3A; --red: #B02429; --blue: #1A429E; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0D1117; --fg: #E7EBF2; --line: #262D3A; --red: #B02429; --blue: #1A429E; color-scheme: dark; }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
    padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 8px; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; user-select: none; -webkit-user-select: none; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .btn:focus-visible { outline-color: var(--fg); }
  @media (max-height: 400px) { body { padding-block: 5px; gap: 5px; } }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar h1 { margin: 0; font: 700 22px var(--font-display); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  .grow { flex: 1; }
  .btn {
    min-height: 40px; padding: 0 14px; border-radius: 8px; background: transparent;
    border: 2px solid var(--line); color: var(--fg); font-weight: 700; font-size: 14px; white-space: nowrap;
  }
  #end { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.confirm { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .result { font-weight: 700; font-size: 15px; padding: 7px 12px; border-radius: 8px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .result.red { background: var(--red); }
  .result.blue { background: var(--blue); }
  .result.tie { background: var(--fg); color: var(--bg); }
  @media (max-width: 420px) { .btn { padding: 0 9px; } .bar { gap: 5px; } .bar h1 { font-size: 19px; } }
  @media (max-height: 400px) { .bar h1 { display: none; } .btn { min-height: 36px; } }

  /* ---------- board ---------- */
  main { flex: 1; min-height: 0; overflow: hidden; display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel {
    --side: var(--red); background: var(--side); color: #fff; border-radius: 12px; padding: 8px;
    display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 8px;
    container-type: size; min-width: 0; min-height: 0; overflow: hidden;
  }
  .panel.blue { --side: var(--blue); }
  .panel.win { box-shadow: inset 0 0 0 4px #fff; }
  .panel.locked .keys, .panel.locked .acts { opacity: .5; }

  /* keys: +1 +2 +3 / undo stacked vertically on the outer edge */
  .keys { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
  .pt {
    flex: 1; min-height: 0; border-radius: 10px; background: #fff; color: var(--side);
    font: 700 clamp(24px, min(13cqh, 26cqw), 80px) var(--font-display); line-height: 1; transition: transform .06s;
  }
  .pt:active:not(:disabled) { transform: scale(.96); }
  .pt:disabled { opacity: .35; cursor: not-allowed; }
  .undo {
    flex: .8; min-height: 0; border-radius: 10px; background: rgba(0,0,0,.32); color: #fff;
    border: 2px solid rgba(255,255,255,.7); font-weight: 700; font-size: 15px; padding: 2px 4px;
    display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.1;
  }
  .undo:disabled { opacity: .35; cursor: not-allowed; }
  .undo b { font: 700 15px var(--font-display); letter-spacing: .04em; }

  /* info: chip, total, tallies, warning / deduct */
  .info { display: flex; flex-direction: column; gap: 5px; min-width: 0; min-height: 0; }
  .panel.blue .info { align-items: flex-end; text-align: right; }
  .chip-row { display: flex; align-items: center; gap: 6px; }
  .panel.blue .chip-row { flex-direction: row-reverse; }
  .chip { background: rgba(0,0,0,.28); border-radius: 6px; padding: 2px 10px; font: 700 16px var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
  .tag { background: #fff; color: #111; font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 6px; }
  .total { font: 700 min(26cqh, 36cqw) var(--font-display); line-height: .9; font-variant-numeric: tabular-nums; }
  .total.bump { animation: bump .2s ease-out; }
  @keyframes bump { 0% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .acts { margin-top: auto; display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .step { min-width: 0; display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto auto; align-items: center; gap: 2px 4px; background: rgba(0,0,0,.3); border-radius: 10px; padding: 4px; }
  .step .lbl { grid-column: 1 / -1; font-size: 12px; font-weight: 700; text-align: center; line-height: 1.1; }
  .step b { font: 700 26px/1 var(--font-display); min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; }
  .step button { min-height: 40px; border-radius: 8px; background: rgba(255,255,255,.92); color: var(--side); font: 700 24px/1 var(--font-display); }
  .step .lbl { order: -2; }
  /* + sits on the outer edge: red [+] n [−], blue [−] n [+] */
  .panel.red .step button[data-act$="+"] { order: -1; }
  .panel.red .step button[data-act$="-"] { order: 1; }
  .step.warn { border: 2px solid rgba(255,255,255,.75); }
  .step button:active:not(:disabled) { transform: scale(.95); }
  .step button:disabled { opacity: .35; cursor: not-allowed; }

  @container (max-width: 270px) {
    .panel { grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr); gap: 6px; padding: 6px; }
    .total { font-size: min(22cqh, 44cqw); }
    .step { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 2px 2px; padding: 3px; }
    .step b { font-size: 20px; min-width: 1em; }
    .step .lbl { font-size: 10px; white-space: nowrap; }
    .step button { min-width: 0; padding: 0; font-size: 20px; min-height: 36px; }
  }
  @container (max-height: 270px) { .total { font-size: min(24cqh, 36cqw); } .step button { min-height: 34px; } }
  @container (max-height: 240px) { .step { grid-template-rows: auto; } .step .lbl { display: none; } .step button { min-height: 32px; } }
  @media (prefers-reduced-motion: reduce) { .total.bump { animation: none; } .pt, .small { transition: none; } }
</style>

<div class="bar">
  <h1>ITF Sparring</h1>
  <span class="grow"></span>
  <div class="result" id="result" hidden aria-live="polite"></div>
  <button class="btn" id="back" type="button" hidden>← Edit</button>
  <button class="btn" id="end" type="button">✓ End</button>
  <button class="btn" id="reset" type="button">↺ Reset</button>
</div>

<main>
  <section class="panel red" data-side="red" aria-label="Red">
    <div class="keys">
      <button class="pt" type="button" data-act="p1" aria-label="Red +1">+1</button>
      <button class="pt" type="button" data-act="p2" aria-label="Red +2">+2</button>
      <button class="pt" type="button" data-act="p3" aria-label="Red +3">+3</button>
      <button class="undo" type="button" data-act="undo" id="red-undo">↶ Undo <b id="red-last"></b></button>
    </div>
    <div class="info">
      <div class="chip-row"><span class="chip">Red</span><span class="tag" id="red-win" hidden>★ Win</span></div>
      <div class="total" id="red-total">0</div>
      <div class="acts">
        <div class="step warn"><span class="lbl">⚠ Warning</span>
          <button type="button" data-act="w-" id="red-w-" aria-label="red warning minus">−</button>
          <b id="red-wc">0</b>
          <button type="button" data-act="w+" id="red-w+" aria-label="red warning plus">+</button></div>
        <div class="step foul"><span class="lbl">✕ Foul −1</span>
          <button type="button" data-act="d-" id="red-d-" aria-label="red foul minus">−</button>
          <b id="red-fc">0</b>
          <button type="button" data-act="d+" id="red-d+" aria-label="red foul plus">+</button></div>
      </div>
    </div>
  </section>

  <section class="panel blue" data-side="blue" aria-label="Blue">
    <div class="info">
      <div class="chip-row"><span class="chip">Blue</span><span class="tag" id="blue-win" hidden>★ Win</span></div>
      <div class="total" id="blue-total">0</div>
      <div class="acts">
        <div class="step warn"><span class="lbl">⚠ Warning</span>
          <button type="button" data-act="w-" id="blue-w-" aria-label="blue warning minus">−</button>
          <b id="blue-wc">0</b>
          <button type="button" data-act="w+" id="blue-w+" aria-label="blue warning plus">+</button></div>
        <div class="step foul"><span class="lbl">✕ Foul −1</span>
          <button type="button" data-act="d-" id="blue-d-" aria-label="blue foul minus">−</button>
          <b id="blue-fc">0</b>
          <button type="button" data-act="d+" id="blue-d+" aria-label="blue foul plus">+</button></div>
      </div>
    </div>
    <div class="keys">
      <button class="pt" type="button" data-act="p1" aria-label="Blue +1">+1</button>
      <button class="pt" type="button" data-act="p2" aria-label="Blue +2">+2</button>
      <button class="pt" type="button" data-act="p3" aria-label="Blue +3">+3</button>
      <button class="undo" type="button" data-act="undo" id="blue-undo">↶ Undo <b id="blue-last"></b></button>
    </div>
  </section>
</main>

<script>
(function () {
  var KEY = 'itf-sparring-simple-v2';
  var PTS = ['p1', 'p2', 'p3'];
  var LAST = { p1: '+1', p2: '+2', p3: '+3' };
  var $ = function (id) { return document.getElementById(id); };
  var vib = function () { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} };
  var fresh = function () { return { red: { h: [], w: 0, d: 0 }, blue: { h: [], w: 0, d: 0 }, done: false }; };
  var S = fresh();
  var panel = function (side) { return document.querySelector('.panel[data-side="' + side + '"]'); };

  var cnt = function (v) { return Math.max(0, Math.min(99, v | 0)); };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) {
      ['red', 'blue'].forEach(function (k) {
        var x = saved[k] || {};
        S[k] = { h: Array.isArray(x.h) ? x.h.filter(function (a) { return PTS.indexOf(a) >= 0; }).slice(-400) : [], w: cnt(x.w), d: cnt(x.d) };
      });
      S.done = !!saved.done;
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // Points = +1/+2/+3 presses. Every 3 warnings cost 1 point; each foul costs 1 point.
  function tally(x) {
    var c = { p1: 0, p2: 0, p3: 0 };
    x.h.forEach(function (a) { c[a]++; });
    var pts = c.p1 + 2 * c.p2 + 3 * c.p3, ded = Math.floor(x.w / 3) + x.d;
    return { pts: pts, w: x.w, d: x.d, ded: ded, total: pts - ded };
  }

  function renderSide(side, bump) {
    var x = S[side], t = tally(x), big = $(side + '-total');
    big.textContent = t.total;
    if (bump) { big.classList.remove('bump'); void big.offsetWidth; big.classList.add('bump'); }
    $(side + '-wc').textContent = x.w;
    $(side + '-fc').textContent = x.d;
    $(side + '-last').textContent = x.h.length ? LAST[x.h[x.h.length - 1]] : '';
    $(side + '-undo').disabled = S.done || !x.h.length;
    panel(side).classList.toggle('locked', S.done);
    panel(side).querySelectorAll('.pt, .step button').forEach(function (b) { b.disabled = S.done; });
    $(side + '-w-').disabled = S.done || x.w <= 0; $(side + '-d-').disabled = S.done || x.d <= 0;
    $(side + '-w+').disabled = S.done || x.w >= 99; $(side + '-d+').disabled = S.done || x.d >= 99;
  }

  function renderBar() {
    var r = tally(S.red).total, b = tally(S.blue).total;
    var winner = S.done ? (r > b ? 'red' : (b > r ? 'blue' : 'tie')) : null;
    $('end').hidden = S.done; $('back').hidden = !S.done; $('result').hidden = !S.done;
    if (winner) {
      $('result').className = 'result ' + winner;
      $('result').textContent = (winner === 'tie' ? '＝ Draw' : (winner === 'red' ? '★ Red wins' : '★ Blue wins')) + '  ' + r + ' : ' + b;
    }
    ['red', 'blue'].forEach(function (s) { $(s + '-win').hidden = winner !== s; panel(s).classList.toggle('win', winner === s); });
    if (!$('reset').classList.contains('confirm')) $('reset').textContent = '↺ Reset';
  }
  function renderAll(bump) { renderSide('red', bump); renderSide('blue', bump); renderBar(); }

  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-act]');
    if (!btn || S.done) return;
    var side = btn.closest('.panel').getAttribute('data-side'), act = btn.getAttribute('data-act'), x = S[side];
    if (act === 'undo') { if (!x.h.length) return; x.h.pop(); }
    else if (PTS.indexOf(act) >= 0) x.h.push(act);
    else if (act === 'w+') x.w = cnt(x.w + 1);
    else if (act === 'w-') x.w = cnt(x.w - 1);
    else if (act === 'd+') x.d = cnt(x.d + 1);
    else if (act === 'd-') x.d = cnt(x.d - 1);
    else return;
    vib(); save(); renderSide(side, true); renderBar();
  });

  $('end').addEventListener('click', function () { S.done = true; vib(); save(); renderAll(true); });
  $('back').addEventListener('click', function () { S.done = false; vib(); save(); renderAll(false); });

  var timer;
  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!b.classList.contains('confirm')) {
      b.classList.add('confirm'); b.textContent = 'Tap again ↺';
      timer = setTimeout(function () { b.classList.remove('confirm'); b.textContent = '↺ Reset'; }, 3000);
      return;
    }
    clearTimeout(timer); b.classList.remove('confirm'); S = fresh(); save(); renderAll(true);
  });

  renderAll(false);

  function wake() { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
  document.addEventListener('visibilitychange', wake); wake();
})();
</script>
